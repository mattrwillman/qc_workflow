executor: cluster-generic
jobs: 15
latency-wait: 120
keep-going: true
rerun-incomplete: true
printshellcmds: true
use-conda: true

cluster-generic-submit-cmd: "sbatch --job-name=qc-{rule}-{wildcards} --account=gbru_wheat2 --partition={resources.partition} --cpus-per-task={threads} --mem={resources.mem_mb}M --time={resources.runtime} --output=logs/slurm/{rule}-{wildcards}-%j.out --error=logs/slurm/{rule}-{wildcards}-%j.err"

default-resources:
  - mem_mb=8000
  - runtime=480
  - partition="atlas"
